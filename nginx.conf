server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 이 앱은 /admin 하위 경로로 리버스 프록시됩니다 (vite.config.js 의 base: '/admin/' 와 짝을 이룸).
    # 바깥 프록시가 location /admin (트레일링 슬래시 없음) 이라 "/admin" 단독 요청도 여기로 들어오므로 정규화.
    location = /admin {
        return 301 /admin/;
    }

    # 파일명에 해시가 붙는 빌드 산출물은 장기 캐시 (더 구체적인 prefix 라 아래 /admin/ 보다 먼저 매칭)
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router-dom(BrowserRouter, basename=/admin) 클라이언트 라우팅 지원
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 컨테이너 단독 실행/헬스체크 시 편의를 위해 루트도 /admin/ 으로 안내
    location = / {
        return 301 /admin/;
    }
}
